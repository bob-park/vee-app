[package]
name = "vee-app"
version = "0.6.2"
edition = "2024"

[lib]
name = "vee_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-log = "2.10.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-updater = "2.13.1"
sys-locale = "0.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
base64 = "0.22"
clipboard-rs = "0.3.5"
drag = "2.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2 = "0.6.5"
image = { version = "0.25", default-features = false, features = ["gif", "webp", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Media_Audio"] }
windows-icons = "0.4.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
tempfile = "3"

# drag 2.1.1 with one change: on Windows the drag image is held by its centre (ptOffset),
# matching macOS. Drop this once upstream lets the offset be set.
[patch.crates-io]
drag = { path = "vendor/drag" }
